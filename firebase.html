<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub, Google & Email Auth</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; margin: 5px; }
    #login-btn { background-color: #24292e; color: white; }
    #google-btn { background-color: #4285F4; color: white; }
    #logout-btn { background-color: #d73a49; color: white; display: none; }
    #user-info { margin-top: 20px; text-align: center; }
    .avatar { width: 100px; border-radius: 50%; margin-top: 10px; border: 2px solid #24292e; }
    .email-box { margin-top: 15px; border: 1px solid #ccc; padding: 15px; border-radius: 5px; display: flex; flex-direction: column; gap: 5px; width: 250px; }
    input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>

  <div id="auth-container">
    <button id="login-btn">Войти через GitHub</button>
    <button id="google-btn">Войти через Google</button>

    <div class="email-box">
      <input type="email" id="email-input" placeholder="Электронная почта">
      <input type="password" id="password-input" placeholder="Пароль">
      <button id="register-btn" style="background-color: #28a745; color: white;">Регистрация</button>
      <button id="email-login-btn" style="background-color: #007bff; color: white;">Войти по Email</button>
    </div>
  </div>

  <button id="logout-btn">Выйти</button>
  <div id="user-info">Проверка состояния...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GithubAuthProvider, 
      GoogleAuthProvider, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js"; [3]

    const firebaseConfig = {
      apiKey: "AIzaSyAOuLCkuAqeq5GTzbWDRHxqQOhM0PZKnZE",
      authDomain: "vvvv-6109a.firebaseapp.com",
      projectId: "vvvv-6109a",
      storageBucket: "vvvv-6109a.firebasestorage.app",
      messagingSenderId: "41317582664",
      appId: "1:41317582664:web:99f5b1e08ab2afbff2d57d",
      measurementId: "G-F6C6BEHJBL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app); [2, 3]
    const githubProvider = new GithubAuthProvider();
    const googleProvider = new GoogleAuthProvider();

    const loginBtn = document.getElementById('login-btn');
    const googleBtn = document.getElementById('google-btn');
    const registerBtn = document.getElementById('register-btn');
    const emailLoginBtn = document.getElementById('email-login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userInfoDiv = document.getElementById('user-info');
    const authContainer = document.getElementById('auth-container');
    const emailInput = document.getElementById('email-input');
    const passwordInput = document.getElementById('password-input');

    onAuthStateChanged(auth, (user) => { [3]
      if (user) {
        authContainer.style.display = 'none';
        logoutBtn.style.display = 'inline-block';
        userInfoDiv.innerHTML = `
          <p>Вы вошли как:</p>
          <strong>${user.displayName || 'Пользователь'}</strong><br>
          <span>${user.email || 'Email скрыт'}</span><br>
          <img class="avatar" src="${user.photoURL || 'https://placehold.co/100'}" alt="Аватар">
        `;
      } else {
        authContainer.style.display = 'block';
        logoutBtn.style.display = 'none';
        userInfoDiv.innerHTML = '<p>Вы не авторизованы. Пожалуйста, войдите.</p>';
      }
    });

    loginBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, githubProvider);
      } catch (error) {
        console.error(error);
        alert("Ошибка: " + error.message);
      }
    });

    googleBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (error) {
        console.error(error);
        alert("Ошибка: " + error.message);
      }
    });

    registerBtn.addEventListener('click', async () => {
      try {
        await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
      } catch (error) {
        console.error(error);
        alert("Ошибка: " + error.message);
      }
    });

    emailLoginBtn.addEventListener('click', async () => {
      try {
        await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
      } catch (error) {
        console.error(error);
        alert("Ошибка: " + error.message);
      }
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth); [3]
      } catch (error) {
        console.error(error);
      }
    });
  </script>
</body>
</html>
