<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Auth с выходом</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; margin: 5px; }
    #login-btn { background-color: #24292e; color: white; }
    #logout-btn { background-color: #d73a49; color: white; display: none; } /* Скрыта по умолчанию */
    #user-info { margin-top: 20px; text-align: center; }
    .avatar { width: 100px; border-radius: 50%; margin-top: 10px; border: 2px solid #24292e; }
  </style>
</head>
<body>

  <!-- Кнопки управления -->
  <button id="login-btn">Войти через GitHub</button>
  <button id="logout-btn">Выйти</button>

  <!-- Блок с информацией о пользователе -->
  <div id="user-info">Проверка состояния...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    // Импортируем методы signOut и onAuthStateChanged
    import { getAuth, signInWithPopup, GithubAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js"; [3]

    const firebaseConfig = {
      apiKey: "AIzaSyAOuLCkuAqeq5GTzbWDRHxqQOhM0PZKnZE",
      authDomain: "vvvv-6109a.firebaseapp.com",
      projectId: "vvvv-6109a",
      storageBucket: "vvvv-6109a.firebasestorage.app",
      messagingSenderId: "41317582664",
      appId: "1:41317582664:web:99f5b1e08ab2afbff2d57d",
      measurementId: "G-F6C6BEHJBL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app); [2, 3]
    const provider = new GithubAuthProvider();

    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userInfoDiv = document.getElementById('user-info');

    // 1. Отслеживаем состояние авторизации (onAuthStateChanged)
    // Этот метод автоматически срабатывает при загрузке страницы и при изменении состояния входа/выхода
    onAuthStateChanged(auth, (user) => { [3]
      if (user) {
        // Пользователь ВОШЕЛ в систему
        loginBtn.style.display = 'none';
        logoutBtn.style.display = 'inline-block';
        userInfoDiv.innerHTML = `
          <p>Вы вошли как:</p>
          <strong>${user.displayName || 'Пользователь GitHub'}</strong><br>
          <span>${user.email || 'Email скрыт'}</span><br>
          <img class="avatar" src="${user.photoURL}" alt="Аватар">
        `;
      } else {
        // Пользователь ВЫШЕЛ из системы
        loginBtn.style.display = 'inline-block';
        logoutBtn.style.display = 'none';
        userInfoDiv.innerHTML = '<p>Вы не авторизованы. Пожалуйста, войдите.</p>';
      }
    });

    // 2. Логика входа
    loginBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("Ошибка входа:", error);
        alert("Ошибка входа: " + error.message);
      }
    });

    // 3. Логика выхода
    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth); [3]
      } catch (error) {
        console.error("Ошибка выхода:", error);
      }
    });
  </script>
</body>
</html>
