<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub, Google & Email Auth</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      margin: 0; 
      background-color: #ffccd5; /* Более темный розовый фон */
      position: relative;
      overflow: hidden;
    }
    
    /* Эмодзи на фоне */
    .bg-emoji {
      position: absolute;
      font-size: 2.5rem;
      user-select: none;
      z-index: 0;
      opacity: 0.6;
      animation: float 6s ease-in-out infinite alternate;
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-15px) rotate(10deg); }
    }

    /* Форма в виде нежного розового облака */
    #auth-container {
      background-color: #fff0f3; /* Очень нежное розовое облако */
      padding: 40px 50px;
      border-radius: 100px 100px 80px 80px; /* Форма облака */
      box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
      border: 3px solid #ffb3c1;
    }

    button { 
      padding: 12px 20px; 
      font-size: 16px; 
      cursor: pointer; 
      border: none; 
      border-radius: 25px; /* Скругленные кнопки */
      margin: 8px 5px; 
      transition: transform 0.2s, opacity 0.2s;
      font-weight: bold;
    }
    button:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }

    #login-btn { background-color: #24292e; color: white; width: 100%; }
    #google-btn { background-color: #4285F4; color: white; width: 100%; }
    #logout-btn { background-color: #d73a49; color: white; display: none; border-radius: 25px; z-index: 1; }
    
    #user-info { margin-top: 20px; text-align: center; z-index: 1; color: #4a001f; font-weight: bold; }
    .avatar { width: 100px; border-radius: 50%; margin-top: 10px; border: 3px solid #ffccd5; }
    
    .email-box { 
      margin-top: 15px; 
      padding: 10px 0 0 0; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      width: 250px; 
    }
    
    input { 
      padding: 10px 15px; 
      border: 2px solid #ffccd5; 
      border-radius: 20px; 
      outline: none;
      font-size: 14px;
      background-color: #fff;
    }
    input:focus {
      border-color: #ff85a1;
    }
  </style>
</head>
<body>

  <!-- Фоновые эмодзи -->
  <div class="bg-emoji" style="top: 10%; left: 10%; animation-delay: 0s;">🩷</div>
  <div class="bg-emoji" style="top: 20%; right: 12%; animation-delay: 1s;">🩷</div>
  <div class="bg-emoji" style="bottom: 15%; left: 15%; animation-delay: 2s;">🩷</div>
  <div class="bg-emoji" style="bottom: 25%; right: 10%; animation-delay: 1.5s;">🩷</div>
  <div class="bg-emoji" style="top: 45%; left: 5%; animation-delay: 0.5s;">🩷</div>

  <div id="auth-container">
    <button id="login-btn">Войти через GitHub</button>
    <button id="google-btn">Войти через Google</button>

    <div class="email-box">
      <input type="email" id="email-input" placeholder="Электронная почта">
      <input type="password" id="password-input" placeholder="Пароль">
      <button id="register-btn" style="background-color: #28a745; color: white;">Регистрация</button>
      <button id="email-login-btn" style="background-color: #007bff; color: white;">Войти по Email</button>
    </div>
  </div>

  <button id="logout-btn">Выйти</button>
  <div id="user-info">Проверка состояния...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithPopup, 
      GithubAuthProvider, 
      GoogleAuthProvider, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js"; [3]

    const firebaseConfig = {
      apiKey: "AIzaSyAOuLCkuAqeq5GTzbWDRHxqQOhM0PZKnZE",
      authDomain: "vvvv-6109a.firebaseapp.com",
      projectId: "vvvv-6109a",
      storageBucket: "vvvv-6109a.firebasestorage.app",
      messagingSenderId: "41317582664",
      appId: "1:41317582664:web:99f5b1e08ab2afbff2d57d",
      measurementId: "G-F6C6BEHJBL"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app); [2, 3]
    const githubProvider = new GithubAuthProvider();
    const googleProvider = new GoogleAuthProvider();

    const loginBtn = document.getElementById('login-btn');
    const googleBtn = document.getElementById('google-btn');
    const registerBtn = document.getElementById('register-btn');
    const emailLoginBtn = document.getElementById('email-login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const userInfoDiv = document.getElementById('user-info');
    const authContainer = document.getElementById('auth-container');
    const emailInput = document.getElementById('email-input');
    const passwordInput = document.getElementById('password-input');

    onAuthStateChanged(auth, (user) => { [3]
      if (user) {
        authContainer.style.display = 'none';
        logoutBtn.style.display = 'inline-block';
        userInfoDiv.innerHTML = `
          <p>Вы вошли как:</p>
          <strong>${user.displayName || 'Пользователь'}</strong><br>
          <span>${user.email || 'Email скрыт'}</span><br>
          <img class="avatar" src="${user.photoURL || 'https://placehold.co/100'}" alt="Аватар">
        `;
      } else {
        authContainer.style.display = 'flex';
        logoutBtn.style.display = 'none';
        userInfoDiv.innerHTML = '<p>Вы не авторизованы. Пожалуйста, войдите.</p>';
      }
    });

    loginBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, githubProvider);
      } catch (error) {
        console.error(error);
        alert("Ошибка: " + error.message);
      }
    });

    googleBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (error) {
        console.error(error);
        alert("Ошибка: " + error.message);
      }
    });

    registerBtn.addEventListener('click', async () => {
      try {
        await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
      } catch (error) {
        console.error(error);
        alert("Ошибка: " + error.message);
      }
    });

    emailLoginBtn.addEventListener('click', async () => {
      try {
        await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
      } catch (error) {
        console.error(error);
        alert("Ошибка: " + error.message);
      }
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        await signOut(auth); [3]
      } catch (error) {
        console.error(error);
      }
    });
  </script>
</body>
</html>
